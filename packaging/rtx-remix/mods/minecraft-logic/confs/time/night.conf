# Night look: caps auto-exposure so the sky stays dark and raises bloom so
# emitters bloom. Applies from dusk through night until the blend to dawn.
# Authoring guide: ../../README.md

# Cap auto-exposure so a dark sky never drives exposure down; matches dusk
# so the two do not oscillate.
rtx.autoExposure.evMaxValue = -0.5

# Night deliberately reverses the selective daytime baseline: the low
# pre-tonemap threshold admits dimmer emitters, while the higher burn intensity
# makes their bloom visible. Treat these two values as one authored pair.
rtx.bloom.burnIntensity = 1.5
rtx.bloom.luminanceThreshold = 1