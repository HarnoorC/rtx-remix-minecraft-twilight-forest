# Underwater volumetric profile - full strength immediately while the camera
# is underwater. This is independent from the water surface material:
# /rtx water color and /rtx water distance do not update this file or these
# resolved volumetric values. Tune the surface and underwater look separately,
# or keep them aligned by hand when that matches the desired art direction.
# See ../README.md, especially the Water section.
rtx.volumetrics.enable = True
rtx.volumetrics.transmittanceColor = 0.6, 0.9, 0.89
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 20.0
# Balance scattering against the channel-dependent extinction so white lights
# remain neutral while transmittance still colors distant light blue-green.
rtx.volumetrics.singleScatteringAlbedo = 0.206, 0.999, 0.903
rtx.volumetrics.anisotropy = 0.4
