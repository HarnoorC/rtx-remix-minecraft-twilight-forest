# Integration-owned, not an art profile. While a weather, biome, or zone
# profile is still moving, the volumetric froxel radiance cache keeps a short
# history so the new medium appears with the sky instead of seconds later.
# Steady state falls back to rtx.conf and the Remix default (128 frames). The
# runtime stores froxel history age normalized by this value, so raising and
# lowering it rescales existing history rather than discarding it. Keep this
# file sparse: any art profile may override it.
rtx.volumetrics.maxAccumulationFrames = 8
rtx.volumetrics.temporalReuseMaxSampleCount = 1
