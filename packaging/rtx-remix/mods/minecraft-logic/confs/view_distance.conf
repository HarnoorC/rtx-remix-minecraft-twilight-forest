# Automatic view-distance endpoint for Minecraft's minimum 2-chunk setting.
# rtx.conf supplies the 32-chunk endpoint (358.4..409.6 blocks). The mod
# blends this layer from strength 1 at 2 chunks to 0 at 32 chunks, exactly
# reconstructing the 70%..80% fade band for every intermediate setting.
#
# This integration-owned profile is intentionally not an art profile. Keep it
# sparse so every higher-priority situational profile can override these keys.
rtx.viewDistance.distanceFadeMin = 22.4
rtx.viewDistance.distanceFadeMax = 25.6
