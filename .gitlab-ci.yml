# This pipeline serves NVIDIA's internal mirror.
# It is inert outside that mirror, including on GitHub.
include:
  - project: $CI_PROJECT_NAMESPACE/rtx-remix-minecraft-int
    ref: c74dce504ac22bd47b18013d2baee7877b8a1e2a
    file: ci/gitlab/.gitlab-ci.yml

# GitLab requires MR-pipeline rules in the root file.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      auto_cancel:
        on_new_commit: conservative
    - !reference [.mirror_pipeline_sources, rules]
